<div class="cmdBackdrop" *ngIf="isOpen" (click)="close()">
  <div class="cmdModal" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="cmdHeader">
      <span class="cmdSearchIcon">🔍</span>
      <input
        type="text"
        placeholder="Type a command or search..."
        [(ngModel)]="searchQuery"
        (ngModelChange)="selectedIndex = 0"
        class="cmdInput"
        autofocus/>
      <span class="cmdEscBadge">ESC</span>
    </div>

    <!-- Results -->
    <div class="cmdList" *ngIf="filteredCommands.length > 0">
      <div
        *ngFor="let item of filteredCommands; let i = index"
        class="cmdItem"
        [class.cmdActive]="i === selectedIndex"
        (click)="execute(item)"
        (mouseenter)="selectedIndex = i">
        <span class="cmdItemIcon">{{ item.icon }}</span>
        <span class="cmdItemTitle">{{ item.title }}</span>
        <span class="cmdItemCategory">{{ item.category }}</span>
      </div>
    </div>

    <!-- Empty -->
    <div class="cmdEmpty" *ngIf="filteredCommands.length === 0">
      No matching results found for "{{ searchQuery }}"
    </div>

    <!-- Footer -->
    <div class="cmdFooter">
      <span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Select</span>
      <span><kbd>esc</kbd> Dismiss</span>
    </div>
  </div>
</div>
