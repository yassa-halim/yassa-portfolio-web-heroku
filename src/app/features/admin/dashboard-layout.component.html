<div class="dashboard-root">
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">Y</div>
        <span class="brand-text">yassa.dev</span>
        <span class="brand-badge">CMS</span>
      </div>

      <!-- Navigation -->
      <nav class="nav-menu">
        <a
          *ngFor="let item of menuItems"
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-item">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </nav>

      <!-- Footer / Logout -->
      <div class="sidebar-footer">
        <a routerLink="/" class="nav-item view-site-btn" target="_blank">
          <span>🌐</span> View Portfolio →
        </a>
        <button (click)="onLogout()" class="nav-item logout-btn">
          <span>🚪</span> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
