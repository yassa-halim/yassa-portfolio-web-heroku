<div class="header">
  <div class="title-group">
    <h1>General Site Settings</h1>
    <p>Update personal info, contact email, social media links, and bio text</p>
  </div>
  <button class="btn btn-primary" (click)="saveSettings()">
    {{ saved ? 'Saved ✓' : 'Save Changes' }}
  </button>
</div>

<form (ngSubmit)="saveSettings()" class="settings-form">
  <!-- General Info Card -->
  <div class="card">
    <h3 class="card-section-title">General Information</h3>

    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="config.name" name="name" class="form-control" />
      </div>
      <div class="form-group">
        <label>Professional Title</label>
        <input type="text" [(ngModel)]="config.title" name="title" class="form-control" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Contact Email</label>
        <input type="email" [(ngModel)]="config.email" name="email" class="form-control" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" [(ngModel)]="config.location" name="location" class="form-control" />
      </div>
    </div>
  </div>

  <!-- Socials Card -->
  <div class="card">
    <h3 class="card-section-title">Social Links</h3>

    <div class="form-row">
      <div class="form-group">
        <label>GitHub URL</label>
        <input type="text" [(ngModel)]="config.socials.github" name="github" class="form-control" />
      </div>
      <div class="form-group">
        <label>LinkedIn URL</label>
        <input type="text" [(ngModel)]="config.socials.linkedin" name="linkedin" class="form-control" />
      </div>
    </div>

    <div class="form-group">
      <label>Twitter / X URL</label>
      <input type="text" [(ngModel)]="config.socials.twitter" name="twitter" class="form-control" />
    </div>
  </div>

  <!-- About & Bio Card -->
  <div class="card">
    <h3 class="card-section-title">Bio &amp; Philosophy</h3>

    <div class="form-group">
      <label>Philosophy Statement</label>
      <textarea [(ngModel)]="config.about.philosophy" name="philosophy" rows="3" class="form-control"></textarea>
    </div>
  </div>
</form>

<!-- Security & Password Card -->
<div class="card" style="margin-top: 1.5rem;">
  <h3 class="card-section-title">🔒 Security &amp; Admin Password</h3>
  <p style="color: #888; font-size: 0.85rem; margin-bottom: 1rem;">Update your admin dashboard password</p>

  <div *ngIf="passwordMsg" class="alert alert-success" style="color: #10b981; margin-bottom: 1rem; font-weight: 500;">
    {{ passwordMsg }}
  </div>
  <div *ngIf="passwordError" class="alert alert-danger" style="color: #ef4444; margin-bottom: 1rem; font-weight: 500;">
    {{ passwordError }}
  </div>

  <form (ngSubmit)="changePassword()">
    <div class="form-row">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" [(ngModel)]="oldPassword" name="oldPassword" class="form-control" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required />
      </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="isSubmittingPassword">
      {{ isSubmittingPassword ? 'Updating...' : 'Update Password' }}
    </button>
  </form>
</div>
