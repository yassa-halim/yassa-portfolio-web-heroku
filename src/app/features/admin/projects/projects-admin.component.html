<div class="header">
  <div class="title-group">
    <h1>Manage Projects</h1>
    <p>Create, update, or remove portfolio projects in real time</p>
  </div>
  <button class="btn btn-primary" (click)="openAddModal()">+ Add New Project</button>
</div>

<!-- Table -->
<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Project</th>
        <th>Category</th>
        <th>Tech Stack</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of dataService.projects">
        <td style="display: flex; align-items: center; gap: 12px">
          <img [src]="p.coverImage" [alt]="p.title" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover" />
          <div>
            <strong style="color: var(--white); display: block">{{ p.title }}</strong>
            <span style="color: var(--muted); font-size: 0.8rem">{{ p.subtitle }}</span>
          </div>
        </td>
        <td><span class="tag">{{ p.category }}</span></td>
        <td>
          <span *ngFor="let tech of p.techStack.slice(0, 3)" class="tech-badge">{{ tech }}</span>
        </td>
        <td>
          <span class="status-badge" [class.status-published]="p.status === 'published'" [class.status-draft]="p.status === 'draft'">
            {{ p.status }}
          </span>
        </td>
        <td>
          <div class="actions-cell">
            <button class="btn btn-secondary btn-sm" (click)="openEditModal(p)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="deleteProject(p.id)">Delete</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ editingId ? 'Edit Project' : 'Add New Project' }}</h2>
      <button class="close-btn" (click)="closeModal()">✕</button>
    </div>

    <form (ngSubmit)="saveProject()" class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" [(ngModel)]="formProject.title" name="title" required class="form-control" placeholder="e.g. TaskFlow" />
        </div>
        <div class="form-group">
          <label>Subtitle</label>
          <input type="text" [(ngModel)]="formProject.subtitle" name="subtitle" class="form-control" placeholder="e.g. Smart Task Management" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select [(ngModel)]="formProject.category" name="category" class="form-control">
            <option value="Mobile App">Mobile App</option>
            <option value="Web">Web</option>
            <option value="Desktop">Desktop</option>
            <option value="Full Stack">Full Stack</option>
          </select>
        </div>
        <div class="form-group">
          <label>Cover Image URL</label>
          <input type="text" [(ngModel)]="formProject.coverImage" name="coverImage" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea [(ngModel)]="formProject.description" name="description" rows="3" required class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label>Tech Stack (Comma Separated)</label>
        <input type="text" [(ngModel)]="techInput" name="techStack" class="form-control" placeholder="Flutter, Dart, Firebase, BLoC" />
      </div>

      <div class="form-group">
        <label>Key Features (Comma Separated)</label>
        <input type="text" [(ngModel)]="featureInput" name="features" class="form-control" placeholder="Real-time sync, Custom animations, Push notifications" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>GitHub Repository URL</label>
          <input type="text" [(ngModel)]="formProject.githubUrl" name="githubUrl" class="form-control" />
        </div>
        <div class="form-group">
          <label>Live Demo URL</label>
          <input type="text" [(ngModel)]="formProject.liveUrl" name="liveUrl" class="form-control" />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Project</button>
      </div>
    </form>
  </div>
</div>
