<section id="skills" class="skills">
  <!-- Grid Background -->
  <div class="grid" aria-hidden="true"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <span class="sectionTag"><span class="tagDot"></span>Skills</span>
      <h2 class="section-title">Build Progress</h2>
      <p class="section-subtitle">Technologies &amp; tools I use to craft digital experiences</p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <!-- Filters -->
      <div class="filters">
        <button
          *ngFor="let cat of categories"
          class="filterBtn"
          [class.filterActive]="activeFilter === cat"
          (click)="activeFilter = cat">
          {{ cat }}
        </button>
      </div>

      <!-- Uiverse Animated Search Input Container -->
      <div class="searchWrapper">
        <div class="glow"></div>
        <div class="darkBorderBg"></div>
        <div class="white"></div>
        <div class="border"></div>
        <div class="main">
          <input
            type="text"
            placeholder="Search skills..."
            [(ngModel)]="searchQuery"
            class="input"/>
          <div class="inputMask"></div>
          <div class="pinkMask"></div>
          <div class="filterBorder"></div>
          <div class="filterIcon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
          </div>
          <div class="searchIcon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c0b9c0" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Skills Pyramid -->
    <div class="pyramidContainer" *ngIf="filteredSkills.length > 0">
      <div *ngFor="let row of pyramidRows; let ri = index; trackBy: trackByRow" class="pyramidRow">
        <div
          *ngFor="let skill of row; let si = index; trackBy: trackById"
          class="coin"
          [style.animation-delay]="((si + ri * 10) * 0.1) + 's'">
          <span class="coinIcon">
            <img *ngIf="isImage(skill.icon)" [src]="skill.icon" [alt]="skill.name" class="iconImage"/>
            <span *ngIf="!isImage(skill.icon)">{{ skill.icon }}</span>
          </span>
          <h3 class="coinName">{{ skill.name }}</h3>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty" *ngIf="filteredSkills.length === 0">
      <span class="emptyIcon">🔍</span>
      <p>No skills found matching your search</p>
    </div>
  </div>
</section>
