<section id="home" #heroSection class="hero" [class.visible]="heroVisible">
  <!-- Aurora Background -->
  <div class="aurora" aria-hidden="true">
    <div class="auroraBlob1"></div>
    <div class="auroraBlob2"></div>
    <div class="auroraBlob3"></div>
  </div>

  <!-- Widget Tree SVG -->
  <svg class="widgetTree" viewBox="0 0 400 400" aria-hidden="true">
    <path
      d="M 200,50 L 200,100 M 200,100 L 100,200 M 200,100 L 300,200 M 100,200 L 50,300 M 100,200 L 150,300 M 300,200 L 250,300 M 300,200 L 350,300"
      class="treeLine" [class.treeLineResolved]="nodeVisible(1)"/>
    <circle cx="200" cy="50" r="8" class="treeNode" [class.treeNodeResolved]="nodeVisible(0)"/>
    <text x="220" y="54" class="treeText" [class.treeTextResolved]="nodeVisible(0)">App()</text>
    <circle cx="100" cy="200" r="6" class="treeNode" [class.treeNodeResolved]="nodeVisible(2)"/>
    <circle cx="300" cy="200" r="6" class="treeNode" [class.treeNodeResolved]="nodeVisible(2)"/>
    <text x="60" y="200" class="treeText" [class.treeTextResolved]="nodeVisible(2)">Scaffold</text>
    <text x="310" y="200" class="treeText" [class.treeTextResolved]="nodeVisible(2)">Column</text>
  </svg>

  <!-- Hero Content -->
  <div class="content">
    <!-- Badge -->
    <div class="badge" [style.opacity]="nodeVisible(0) ? 1 : 0">
      <span class="badgeDot"></span>
      <span class="font-mono">Available for hire</span>
    </div>

    <!-- Name -->
    <h1 class="name" [style.opacity]="nodeVisible(3) ? 1 : 0">
      <span
        *ngFor="let char of nameChars; let i = index"
        class="nameChar"
        [style.animation-delay]="(0.4 + i * 0.03) + 's'">
        {{ char === ' ' ? '\u00A0' : char }}
      </span>
    </h1>

    <!-- Typewriter Role -->
    <div class="roleWrapper" [style.opacity]="nodeVisible(4) ? 1 : 0">
      <span class="roleText">{{ roleText }}</span>
      <span class="roleCursor">|</span>
    </div>

    <!-- Subtitle -->
    <p class="subtitle" [style.opacity]="nodeVisible(4) ? 1 : 0">
      {{ config?.hero?.subtitle }}
    </p>

    <!-- CTA Buttons -->
    <div class="ctas" [style.opacity]="nodeVisible(5) ? 1 : 0">
      <ng-container *ngFor="let btn of config?.hero?.cta">
        <!-- Animated Primary Button -->
        <button
          *ngIf="btn.variant === 'primary'"
          class="animatedButton"
          (click)="handleCta(btn.href)">
          <svg viewBox="0 0 24 24" class="arr2" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"/>
          </svg>
          <span class="text">{{ btn.label }}</span>
          <span class="circle"></span>
          <svg viewBox="0 0 24 24" class="arr1" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"/>
          </svg>
        </button>

        <!-- Outline Button -->
        <button
          *ngIf="btn.variant === 'outline'"
          class="ctaBtn cta_outline"
          (click)="handleCta(btn.href)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          {{ btn.label }}
        </button>

        <!-- Ghost Button -->
        <button
          *ngIf="btn.variant === 'ghost'"
          class="ctaBtn cta_ghost"
          (click)="handleCta(btn.href)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          {{ btn.label }}
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scrollIndicator" aria-hidden="true">
    <div class="scrollMouse">
      <div class="scrollDot"></div>
    </div>
    <span class="scrollText">Scroll</span>
  </div>
</section>
